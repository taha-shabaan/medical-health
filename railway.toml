# Migrations: pre-deploy. Web binds to $PORT immediately (see startCommand).
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["php", "artisan", "migrate", "--force"]
# Bind HTTP right away; $PORT must expand in a shell (not as a literal ${PORT} argv to php).
startCommand = "php -S 0.0.0.0:${PORT} -t public"
healthcheckPath = "/up"
healthcheckTimeout = 300
