[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["php artisan config:cache", "php artisan route:cache"]

# Do not run migrate here — Railway preDeployCommand (railway.toml) handles it; otherwise healthchecks fail until migrate finishes.
[start]
cmd = "/bin/sh -c \"exec php artisan serve --host=0.0.0.0 --port=${PORT:-8080}\""
